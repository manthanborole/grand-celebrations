
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hall Booking Manager</title>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F3F4F6;
            --card-bg: #FFFFFF;
            --text-main: #1F2937;
            --text-muted: #6B7280;
            --border: #E5E7EB;
        }

        body {
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 700px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }

        h1 {
            margin-top: 0;
            color: var(--text-main);
            font-size: 1.8rem;
            text-align: center;
            border-bottom: 2px solid var(--bg-color);
            padding-bottom: 1rem;
            margin-bottom: 1.5rem;
        }

        .form-group {
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        input[type="text"], select {
            flex: 1;
            padding: 10px 15px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        button.add-btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.2s;
        }

        button.add-btn:hover {
            background-color: var(--primary-hover);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th {
            background-color: #F9FAFB;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        td {
            font-size: 0.95rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-muted);
            font-style: italic;
        }

        /* Action Buttons */
        .action-btn {
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            margin-right: 5px;
            transition: opacity 0.2s;
        }

        .action-btn:hover {
            opacity: 0.8;
        }

        .edit-btn {
            background-color: #F59E0B;
            color: white;
        }

        .delete-btn {
            background-color: #EF4444;
            color: white;
        }

        @media (max-width: 500px) {
            .form-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Hall Allocations</h1>
        
        <form id="recordForm">
            <div class="form-group">
                <input type="text" id="nameInput" placeholder="Enter Full Name" required>
                <select id="hallSelect" required>
                    <option value="" disabled selected>Select Hall</option>
                    <option value="Hall 1">Hall 1</option>
                    <!-- Hall 2 removed as requested -->
                    <option value="Hall 3">Hall 3</option>
                    <option value="Hall 4">Hall 4</option>
                </select>
                <button type="submit" class="add-btn">Add</button>
            </div>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Assigned Hall</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <!-- Records will be injected here by JavaScript -->
            </tbody>
        </table>
    </div>

    <script>
        // Array to store the records
        let records = [];

        // DOM Elements
        const recordForm = document.getElementById('recordForm');
        const nameInput = document.getElementById('nameInput');
        const hallSelect = document.getElementById('hallSelect');
        const tableBody = document.getElementById('tableBody');

        // Form Submit Handler
        recordForm.addEventListener('submit', function(e) {
            e.preventDefault();
            
            const newRecord = {
                name: nameInput.value.trim(),
                hall: hallSelect.value
            };

            records.push(newRecord);
            
            // Clear inputs
            nameInput.value = '';
            hallSelect.value = '';
            
            renderTable();
        });

        // Function to change a name
        function editName(index) {
            const currentName = records[index].name;
            const newName = prompt("Enter the new name:", currentName);
            
            // Check if user clicked OK and actually entered something
            if (newName !== null && newName.trim() !== "") {
                records[index].name = newName.trim();
                renderTable();
            }
        }

        // Function to delete a single record
        function deleteRecord(index) {
            if (confirm("Are you sure you want to delete this record?")) {
                records.splice(index, 1);
                renderTable();
            }
        }

        // Function to draw the table UI
        function renderTable() {
            tableBody.innerHTML = '';

            if (records.length === 0) {
                tableBody.innerHTML = `<tr><td colspan="3" class="empty-state">No records found. Add someone above.</td></tr>`;
                return;
            }

            records.forEach((record, index) => {
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><strong>${record.name}</strong></td>
                    <td>${record.hall}</td>
                    <td>
                        <button class="action-btn edit-btn" onclick="editName(${index})">Edit Name</button>
                        <button class="action-btn delete-btn" onclick="deleteRecord(${index})">Delete</button>
                    </td>
                `;
                
                tableBody.appendChild(row);
            });
        }

        // Initial render to show the empty state
        renderTable();
    </script>
</body>
</html>
